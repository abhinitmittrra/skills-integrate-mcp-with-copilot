<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="login-toggle" class="login-toggle" type="button" aria-expanded="false">
        👤 Teacher login
      </button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <section id="teacher-login" class="teacher-login hidden" aria-label="Teacher login">
      <form id="login-form">
        <div class="form-group">
          <label for="username">Teacher username:</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit">Log in</button>
      </form>
      <div id="login-message" class="hidden" role="status"></div>
    </section>

    <div id="teacher-session" class="teacher-session hidden">
      <span id="teacher-name"></span>
      <button id="logout-button" type="button">Log out</button>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Manage Activity Registrations</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student email:</label>
            <input type="email" id="email" required placeholder="student@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Register student</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
